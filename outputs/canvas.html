<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>画布</title>
<style>
  body { margin: 0; background: #f6f7f9; }
  canvas { display: block; margin: 24px auto; background: #fff; border: 1px solid #e6e8eb; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="cv" width="800" height="500"></canvas>
<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let drawing = false;

  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#2563eb';

  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };

  cv.addEventListener('pointerdown', (e) => {
    drawing = true;
    cv.setPointerCapture(e.pointerId);
    const [x, y] = pos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
  });

  cv.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const [x, y] = pos(e);
    ctx.lineTo(x, y);
    ctx.stroke();
  });

  cv.addEventListener('pointerup', () => { drawing = false; });
</script>
</body>
</html>
